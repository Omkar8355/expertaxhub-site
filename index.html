<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expert Tax Hub — We're Updating Our Site</title>
<meta name="description" content="Expert Tax Hub LLP — Tax, Legal and Investment Advisory. Site update in progress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0A0A0B;
    --black-2: #131315;
    --gold: #C9A34E;
    --gold-bright: #E8C97A;
    --gold-dim: #8A6E2F;
    --cream: #F3ECDD;
    --slate: #9C9793;
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: var(--font-body);
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(201,163,78,0.10) 0%, rgba(201,163,78,0) 60%),
      radial-gradient(80% 80% at 50% 100%, #17140C 0%, var(--black) 55%);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* Ambient floating gold particles */
  .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; }
  .particle{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, rgba(201,163,78,0.65) 0%, rgba(201,163,78,0) 70%);
    animation: drift linear infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:1; }
    100%{ transform: translateY(-110vh) translateX(var(--dx, 20px)); opacity:0; }
  }

  /* Fine vignette frame lines */
  .frame-line{
    position: fixed;
    border-color: rgba(201,163,78,0.35);
    z-index:1;
  }
  .frame-line.top{ top:28px; left:28px; right:28px; height:1px; border-top:1px solid rgba(201,163,78,0.35);
    transform: scaleX(0); transform-origin:left; animation: drawX 1.4s ease forwards 0.3s; }
  .frame-line.bottom{ bottom:28px; left:28px; right:28px; height:1px; border-top:1px solid rgba(201,163,78,0.35);
    transform: scaleX(0); transform-origin:right; animation: drawX 1.4s ease forwards 0.3s; }
  @keyframes drawX{ to{ transform: scaleX(1); } }
  @media (max-width: 700px){ .frame-line{ display:none; } }

  .wrap{
    position:relative;
    z-index:2;
    max-width: 560px;
    width: 100%;
    padding: 40px 28px;
    text-align:center;
  }

  /* Wordmark instead of seal graphic */
  .wordmark{
    margin: 0 auto 30px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.15s;
  }
  .wordmark .rule{
    width: 46px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 18px;
    transform: scaleX(0);
    animation: growRule 1.2s ease forwards 0.4s;
  }
  @keyframes growRule{ to{ transform: scaleX(1); } }
  .wordmark h2{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 7vw, 3rem);
    letter-spacing: 0.09em;
    margin: 0;
    color: var(--cream);
    text-transform: uppercase;
    background: linear-gradient(100deg, var(--gold-dim) 0%, var(--gold-bright) 25%, var(--cream) 50%, var(--gold-bright) 75%, var(--gold-dim) 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer{
    0%{ background-position: 0% center; }
    100%{ background-position: -220% center; }
  }
  .wordmark .tagline{
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-top: 10px;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.6rem, 4.6vw, 2.2rem);
    line-height: 1.25;
    margin: 0 0 16px;
    color: #fff;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 0.55s;
  }

  p.lede{
    color: var(--slate);
    font-size: 0.98rem;
    line-height: 1.7;
    max-width: 400px;
    margin: 0 auto 36px;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 0.75s;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .status-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 42px;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 0.95s;
  }
  .dots{ display:flex; gap:5px; }
  .dots span{
    width:5px; height:5px;
    border-radius:50%;
    background: var(--gold);
    animation: bounce 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay: 0.18s; }
  .dots span:nth-child(3){ animation-delay: 0.36s; }
  @keyframes bounce{
    0%,80%,100%{ transform: scale(0.6); opacity:0.35; }
    40%{ transform: scale(1); opacity:1; }
  }

  .btn-row{
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.15s;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background: transparent;
    color: var(--gold-bright);
    text-decoration:none;
    padding: 13px 30px;
    border: 1px solid var(--gold-dim);
    border-radius: 2px;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }
  .btn:hover{
    background: var(--gold);
    color: var(--black);
    border-color: var(--gold);
    box-shadow: 0 8px 26px rgba(201,163,78,0.25);
  }
  .btn svg{ width:16px; height:16px; }

  .footer-note{
    margin-top: 50px;
    font-family: var(--font-mono);
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    color: #55524A;
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.35s;
  }

  @media (prefers-reduced-motion: reduce){
    .particle, .wordmark h2, .frame-line{ animation: none !important; }
    .wordmark, h1, p.lede, .status-row, .btn-row, .footer-note, .rule{
      opacity:1 !important; animation:none !important; transform:none !important;
    }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>
<div class="frame-line top"></div>
<div class="frame-line bottom"></div>

<div class="wrap">
  <div class="wordmark">
    <div class="rule"></div>
    <h2>Expert Tax Hub</h2>
    <div class="tagline">Tax &middot; Legal &middot; Investments</div>
  </div>

  <h1>A refined experience, on its way.</h1>
  <p class="lede">Our site is being updated. Taxation, legal and investment advisory continue as usual — reach us directly on WhatsApp in the meantime.</p>

  <div class="status-row">
    <span>Update in progress</span>
    <span class="dots"><span></span><span></span><span></span></span>
  </div>

  <div class="btn-row">
    <a href="https://wa.me/919324787030?text=Hi%20Expert%20Tax%20Hub%2C%20I%20saw%20your%20site%20is%20updating%20and%20wanted%20to%20get%20in%20touch." class="btn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.06h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.38c0-4.55 3.7-8.25 8.26-8.25 2.2 0 4.28.86 5.84 2.42a8.2 8.2 0 0 1 2.41 5.84c0 4.55-3.71 8.25-8.26 8.25z"/></svg>
      Chat on WhatsApp
    </a>
  </div>

  <div class="footer-note">CHEMBUR &middot; MUMBAI &middot; SINCE 2008</div>
</div>

<script>
  const container = document.getElementById('particles');
  const count = 24;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.bottom = (-10 - Math.random() * 20) + 'vh';
    p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
    p.style.animationDuration = (11 + Math.random() * 15) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
</script>

</body>
</html>
